[pytest]
# Pytest configuration for Image Model Router tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output directories
testpaths = .
cache_dir = .pytest_cache

# Console output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    -l
    # Disable warnings summary
    --disable-warnings

    # Coverage reporting
    --cov=cli_tools.tools.image_model_routing
    --cov-report=html:output/coverage/html
    --cov-report=xml:output/coverage/coverage.xml
    --cov-report=term-missing

    # HTML test report
    --html=output/reports/test_report.html
    --self-contained-html

    # JUnit XML report (for CI/CD)
    --junitxml=output/reports/junit.xml

    # Show test durations
    --durations=10

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests across components
    edge_case: Edge case and boundary condition tests
    performance: Performance and load tests
    slow: Tests that take significant time
    requires_files: Tests that need benchmark files

# Logging
log_cli = true
log_cli_level = INFO
log_file = output/logs/test_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
[coverage:run]
source = cli_tools.tools.image_model_routing
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = output/coverage/html
